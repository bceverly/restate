# Copyright (c) 2026 Bryan C. Everly
# SPDX-License-Identifier: BSD-2-Clause
#
# Publish a release when a version tag is pushed.
#
# `make release` writes the version into VERSION, commits, tags and pushes --
# and the tag push is what lands here. There is no such thing as an untagged
# release.
#
#   gate     wait for CI, Security and CodeQL to have passed on this commit
#   build    the source tarball, built and tested from that tarball on a clean
#            runner
#   bsd      a binary package for each supported release of FreeBSD, OpenBSD
#            and NetBSD (openbsd-8 for OpenBSD 8.0), each built from the
#            tarball in that release's VM with its own package tool, then
#            installed, checked and removed (scripts/verify-bsd-pkg.sh)
#   rpm      an RPM for Fedora, EL 9 and 10, openSUSE Leap 16 and Tumbleweed,
#            x86_64 and aarch64, each built from the tarball in a bare
#            container of that distribution, then installed, used and removed
#            in a fresh one (scripts/build-rpm.sh, scripts/verify-rpm.sh)
#   alpine   Alpine's package for 3.21 to 3.24, x86_64 and aarch64, the same
#            way (scripts/build-apk.sh, scripts/verify-apk.sh)
#   sign     SHA-256 checksums of all of them, and one signed build-provenance
#            attestation (SLSA) that says which workflow made each from which
#            commit
#   publish  a GitHub release with the files, the checksums and the notes:
#            what changed -- the subject of every commit since the previous
#            release tag -- then how to build, install and verify it
#   deb      the binary .deb, checked by lintian, and a signed source package
#            for each Ubuntu series
#   deb-verify  the .deb installed with apt on clean Ubuntu releases, used,
#            and removed (scripts/verify-deb.sh)
#   ppa      the source packages uploaded to the Launchpad PPA, which builds
#            and publishes them for every architecture it has
#   copr     the source RPM sent to Fedora COPR, which builds it for every
#            chroot the project has
#   obs      the tarball and spec committed to the openSUSE Build Service,
#            which builds them for every repository the project has
#   homebrew the formula for this release, installed from source, tested and
#            audited on macOS, then pushed to the Homebrew tap
#
# `ppa` needs `deb-verify`, and `copr` and `obs` need `rpm`, so a package that
# builds but does not install never reaches a repository: an upload there
# cannot be withdrawn, only superseded by a higher version. `homebrew` needs
# `publish`, since the formula downloads the release's tarball. The BSD ports
# come later; see ROADMAP.md.
#
# ---------------------------------------------------------------------------
# What the PPA needs configured in the repository
# ---------------------------------------------------------------------------
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   LAUNCHPAD_GPG_PRIVATE_KEY  the ASCII-armored private key whose public half
#                              is registered on the Launchpad account, and
#                              whose fingerprint debian/signing-fingerprint pins
#   LAUNCHPAD_GPG_PASSPHRASE   that key's passphrase
#
# Variables (the same page, Variables tab) -- optional, defaults shown:
#   LAUNCHPAD_PPA       ppa:bceverly/restate
#   LAUNCHPAD_SERIES    the Ubuntu series to build for, space separated
#                       (default: jammy noble resolute, the supported LTS
#                       releases, each of which the package is built and
#                       installed on before a release)
#
# The upload job runs in the `launchpad` environment, which can be given a
# required reviewer to hold each upload for a person's approval.
#
# ---------------------------------------------------------------------------
# What COPR, OBS and Homebrew need configured
# ---------------------------------------------------------------------------
# Secrets:
#   COPR_LOGIN, COPR_USERNAME, COPR_API_TOKEN
#                       from https://copr.fedorainfracloud.org/api/ (they
#                       expire: COPR says when)
#   OBS_USERNAME, OBS_PASSWORD
#                       the openSUSE Build Service account
#   HOMEBREW_TAP_DEPLOY_KEY
#                       the private half of an SSH deploy key with write
#                       access on the tap's repository
#
# Variables -- optional, defaults shown:
#   COPR_PROJECT        bceverly/restate: made on COPR, with the chroots it is
#                       to build for (Fedora, EPEL 9 and 10, openSUSE...)
#   OBS_PROJECT         home:OBS_USERNAME: holding a package named restate,
#                       with the repositories it is to build for
#   HOMEBREW_TAP        bceverly/homebrew-tap

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================================================
  # A tag push runs neither CI nor the scans -- they are wired to branches --
  # so this waits for the runs that already happened on this exact commit,
  # which `make release` pushed to main before tagging it.
  gate:
    name: Wait for CI, Security and CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the checks on this commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TIMEOUT_MINUTES: "60"
        run: |
          set -euo pipefail
          WANTED="CI Security CodeQL"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          echo "Waiting for [$WANTED] on $SHA"
          while :; do
            PENDING=""
            FAILED=""
            MISSING=""
            for NAME in $WANTED; do
              READ=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                     --jq ".workflow_runs[] | select(.name==\"$NAME\") |
                           [.status, (.conclusion // \"pending\")] | @tsv" \
                     | head -1 || true)
              if [ -z "$READ" ]; then MISSING="$MISSING $NAME"; continue; fi
              STATUS=$(printf '%s' "$READ" | cut -f1)
              CONCLUSION=$(printf '%s' "$READ" | cut -f2)
              if [ "$STATUS" != completed ]; then
                PENDING="$PENDING $NAME($STATUS)"
              elif [ "$CONCLUSION" != success ] && [ "$CONCLUSION" != skipped ]; then
                FAILED="$FAILED $NAME($CONCLUSION)"
              fi
            done
            if [ -n "$FAILED" ]; then
              echo "::error::Refusing to release --$FAILED did not pass on $SHA"
              exit 1
            fi
            # A tag on a commit that never reached a branch has no runs at all.
            if [ -n "$MISSING" ] && [ "$(date +%s)" -gt $(( DEADLINE - (TIMEOUT_MINUTES - 5) * 60 )) ]; then
              echo "::error::No run found for$MISSING on $SHA after 5 minutes."
              echo "::error::Was this commit pushed to a branch before it was tagged?"
              exit 1
            fi
            if [ -z "$PENDING" ] && [ -z "$MISSING" ]; then
              echo "All required checks passed on $SHA."
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES}m waiting for$PENDING$MISSING"
              exit 1
            fi
            echo "  still waiting:$PENDING$MISSING"
            sleep 30
          done

  # ==========================================================================
  build:
    name: Build the release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag and VERSION must agree: a tag pushed by hand is exactly the
      # case where they might not.
      - name: Check the tag matches VERSION
        id: version
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(cat VERSION)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # git archive: exactly the committed tree, nothing from the workspace.
      - name: Make the source tarball
        run: |
          set -eu
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar --prefix="restate-$V/" HEAD | gzip -9n > "dist/restate-$V.tar.gz"

      # The tarball has to build and pass its tests on its own, without the
      # git repository it came from -- which is how everyone downloading it
      # will build it.
      - name: Build and test from the tarball
        run: |
          set -eu
          V="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/fromtar
          tar -xzf "dist/restate-$V.tar.gz" -C /tmp/fromtar
          cd "/tmp/fromtar/restate-$V"
          make build WERROR=-Werror
          make test-unit test-cli
          ./bin/restate --version | head -1 | grep -qx "restate $V"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  # Each BSD's binary package, built in that system's own VM with its own
  # package tool from the release's tarball -- exactly what was released, so
  # the program says exactly this version -- then installed with that
  # system's installer, checked and removed (scripts/verify-bsd-pkg.sh).
  bsd:
    name: Build the ${{ matrix.os }} ${{ matrix.version }} package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      # Every release each system supports: built on each, since each
      # package names the release it was made for. OpenBSD 8.0 is the
      # openbsd-8 job's, below.
      matrix:
        include:
          - os: freebsd
            version: "14.4"
          - os: freebsd
            version: "14.5"
          - os: freebsd
            version: "15.1"
          - os: openbsd
            version: "7.9"
          - os: netbsd
            version: "10.1"
          - os: netbsd
            version: "11.0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      # Unpacked into the workspace, which the action copies into the VM and
      # back. The version goes in a file rather than the VM's environment.
      - name: Unpack the tarball
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xzf "source/restate-$V.tar.gz"
          rm -rf source
          printf '%s\n' "$V" > RELEASE_VERSION

      # A VM that does not come up retries for ever: the step's timeout is
      # the only bound on it.
      - name: Start the VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        timeout-minutes: 15
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}

      - name: Build, install, check and remove the package
        shell: cpa.sh {0}
        run: |
          set -e
          V="$(cat RELEASE_VERSION)"
          [ -n "$V" ] || { echo "RELEASE_VERSION is empty" >&2; exit 1; }
          case "$(uname -s)" in
          FreeBSD)
            sudo pkg install -y bash
            sudo pkg install -y gmake
            ;;
          OpenBSD)
            sudo pkg_add -I bash gmake
            ;;
          NetBSD)
            # The image's pkgin points at FTP, which times out.
            echo "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/$(uname -r)/All" \
              | sudo tee /usr/pkg/etc/pkgin/repositories.conf
            n=0
            until sudo pkgin -y update && sudo pkgin -y install bash gmake; do
              n=$((n + 1))
              [ "$n" -lt 5 ] || { echo "pkgin could not install bash and gmake" >&2; exit 1; }
              sleep 15
            done
            ;;
          esac
          cd "restate-$V"
          gmake bsd-pkg WERROR=-Werror
          sudo scripts/verify-bsd-pkg.sh dist/restate-*
          mkdir -p ../packages
          cp dist/restate-* ../packages/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}-${{ matrix.version }}
          path: packages/
          retention-days: 30
          if-no-files-found: error

  # OpenBSD 8.0's package, as the bsd job makes the others, in vmactions' VM
  # (cross-platform-actions has no image of 8.0 yet), which runs everything as
  # root: the package is built as a user of its own.
  openbsd-8:
    name: Build the openbsd 8.0 package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      - name: Unpack the tarball
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xzf "source/restate-$V.tar.gz"
          rm -rf source
          printf '%s\n' "$V" > RELEASE_VERSION

      - name: Build, install, check and remove the package
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg_add -I bash gmake
          run: |
            set -e
            V="$(cat RELEASE_VERSION)"
            [ -n "$V" ] || { echo "RELEASE_VERSION is empty" >&2; exit 1; }
            useradd -m builder
            chown -R builder "restate-$V"
            cd "restate-$V"
            su builder -c 'gmake bsd-pkg WERROR=-Werror'
            scripts/verify-bsd-pkg.sh dist/restate-*
            mkdir -p ../packages
            cp dist/restate-* ../packages/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-openbsd-8.0
          path: packages/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  # An RPM for each distribution it is built for -- Fedora, RHEL's rebuilds
  # (EL 9 and 10, AlmaLinux standing in for RHEL) and openSUSE -- on each
  # architecture, built from the tarball in a bare container of that
  # distribution with only what the spec asks for (scripts/build-rpm.sh
  # --deps), then installed with dnf or zypper in a fresh one, used and
  # removed (scripts/verify-rpm.sh). COPR and the openSUSE Build Service
  # build their own from the same spec, below, once these have installed.
  rpm:
    name: Build the ${{ matrix.distro }} RPM (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        distro: [fedora, el9, el10, leap16, tumbleweed]
        arch: [x86_64, aarch64]
        include:
          - distro: fedora
            image: registry.fedoraproject.org/fedora:latest
          - distro: el9
            image: docker.io/almalinux/almalinux:9
          - distro: el10
            image: docker.io/almalinux/almalinux:10
          - distro: leap16
            image: registry.opensuse.org/opensuse/leap:16.0
          - distro: tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      - name: Unpack the tarball
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xzf "source/restate-$V.tar.gz"

      - name: Build it in a bare container
        env:
          V: ${{ needs.build.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          mkdir -p packages
          docker run --rm -v "$PWD:/w" -w "/w/restate-$V" "$IMAGE" \
            bash scripts/build-rpm.sh --deps "/w/source/restate-$V.tar.gz" /w/packages
          ls -l packages

      - name: Install it in a fresh one, use it and remove it
        env:
          IMAGE: ${{ matrix.image }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/restate-$V/scripts:/s:ro" \
            "$IMAGE" sh /s/verify-rpm.sh /packages

      # The source package once, for COPR; the binary packages each.
      - name: Keep the packages
        run: |
          set -eu
          mkdir -p keep
          cp packages/restate-*.rpm keep/
          if [ "${{ matrix.distro }}/${{ matrix.arch }}" != fedora/x86_64 ]; then
            rm -f keep/*.src.rpm
          else
            mkdir -p srpm && mv keep/*.src.rpm srpm/
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-rpm-${{ matrix.distro }}-${{ matrix.arch }}
          path: keep/
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.distro == 'fedora' && matrix.arch == 'x86_64'
        with:
          name: srpm
          path: srpm/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  # Alpine's package for each supported release and architecture, built with
  # abuild from the tarball in that release's container (scripts/build-apk.sh)
  # and installed with apk in a fresh one, used and removed
  # (scripts/verify-apk.sh). Signed with a key made for the build, as the BSD
  # packages are by none: the release's checksums and attestation vouch for
  # them, and apk add --allow-untrusted installs them.
  alpine:
    name: Build the Alpine ${{ matrix.version }} package (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      # Every release Alpine supports: each is supported for two years.
      matrix:
        version: ["3.21", "3.22", "3.23", "3.24"]
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      - name: Unpack the tarball
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xzf "source/restate-$V.tar.gz"

      - name: Build it
        env:
          V: ${{ needs.build.outputs.version }}
          ALPINE: ${{ matrix.version }}
        run: |
          set -eu
          mkdir -p packages
          docker run --rm -v "$PWD:/w" -w "/w/restate-$V" "alpine:$ALPINE" \
            sh -c "apk add -q alpine-sdk && sh scripts/build-apk.sh /w/source/restate-$V.tar.gz /w/packages"
          ls -l packages

      - name: Install it in a fresh container, use it and remove it
        env:
          V: ${{ needs.build.outputs.version }}
          ALPINE: ${{ matrix.version }}
        run: |
          set -eu
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/restate-$V/scripts:/s:ro" \
            "alpine:$ALPINE" sh /s/verify-apk.sh /packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-alpine-${{ matrix.version }}-${{ matrix.arch }}
          path: packages/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  # Everything the release holds, checksummed and attested together.
  sign:
    name: Checksum and attest the release files
    needs: [build, bsd, openbsd-8, rpm, alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # to sign the attestation
      attestations: write  # to store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum ./restate-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/restate-*

      # The signed attestation, beside the files in the release too, not only
      # in GitHub's attestation store: a download can be checked offline with
      # it, and a release with no signature file in it is an unsigned release
      # to anyone who looks. One attestation covers every file.
      - name: Attach the signature to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          cp "$BUNDLE" "dist/restate-$V.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  publish:
    name: Publish the GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and its tags: the notes list the commits since the
      # previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          V: ${{ needs.build.outputs.version }}
          COPR: ${{ vars.COPR_PROJECT || 'bceverly/restate' }}
          OBS: ${{ vars.OBS_PROJECT || 'home:bceverly' }}
        run: |
          set -eu
          OBS_URL="$(printf '%s' "$OBS" | sed 's/:/%3A/g')"
          # The release before this one: the newest version tag older than
          # this tag, in version order.
          PREV=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' |
                 sort -V | awk -v t="$TAG" '$0 == t { print last; exit } { last = $0 }')
          {
            echo "restate $V"
            echo
            if [ -n "$PREV" ]; then
              echo "What changed since $PREV:"
              echo
              git log --no-merges --reverse --format='- %s' "$PREV..$TAG" -- \
                | grep -v '^- Release v' || echo "- (no changes besides the version)"
            else
              echo "The first release."
            fi
            echo
            echo "No publicly known vulnerability was fixed in this release unless a"
            echo "line above says so; see SECURITY.md for how they are reported."
          } > notes.md
          # The BSD packages, as the bsd jobs made them, each named for the
          # release and architecture it was built on, with how to install it.
          PACKAGES="$(cd dist && for f in restate-"$V"-*bsd-*; do
            case "$f" in
              *-freebsd-*) printf '    pkg add %s\n' "$f" ;;
              *-openbsd-*) printf '    pkg_add -D unsigned %s\n' "$f" ;;
              *-netbsd-*) printf '    pkg_add %s\n' "$f" ;;
            esac
          done)"
          RPMS="$(cd dist && for f in restate-"$V"-*.rpm; do
            [ -e "$f" ] || continue
            case "$f" in
              *.el* | *.fc*) printf '    sudo dnf install ./%s\n' "$f" ;;
              *) printf '    sudo zypper install --allow-unsigned-rpm ./%s\n' "$f" ;;
            esac
          done)"
          cat >> notes.md <<NOTES

          Install on Ubuntu 22.04, 24.04 or 26.04 from the PPA, once Launchpad
          has built it there (usually within the hour):

              sudo add-apt-repository ppa:bceverly/restate
              sudo apt install restate

          Install on FreeBSD, OpenBSD or NetBSD from the package here for
          your release, each built, installed and tested on it, after checking
          it against SHA256SUMS:

          $PACKAGES

          (OpenBSD's packages are signed by OpenBSD's own means, which these are
          not: the checksums and the attestation below vouch for them instead.)

          Install on Fedora, RHEL 9 or 10 and their rebuilds, from COPR, or on
          openSUSE, from the openSUSE Build Service, once each has built it:

              sudo dnf copr enable $COPR && sudo dnf install restate
              # openSUSE: https://software.opensuse.org/download/package?package=restate&project=$OBS_URL

          or from the package here for your distribution and architecture --
          each built, installed and tested on it:

          $RPMS

          Install on Alpine 3.21 to 3.24 from the packages here, the program
          and its manual, signed by no key Alpine knows (the checksums and the
          attestation vouch for them):

              apk add --allow-untrusted restate-$V-r0-alpineREL-ARCH.apk \
                  restate-doc-$V-r0-alpineREL-ARCH.apk

          Install on macOS with Homebrew:

              brew install bceverly/tap/restate

          Build and install from source (Ubuntu 26.04 and any Linux, the BSDs
          with gmake, macOS):

              tar -xzf restate-$V.tar.gz && cd restate-$V
              make build && sudo make install

          Verify a download -- the tarball, or any of the packages:

              sha256sum -c --ignore-missing SHA256SUMS
              gh attestation verify restate-$V.tar.gz --repo $REPO

          or offline, with the signed attestation attached here, which covers
          every file in the release:

              gh attestation verify restate-$V.tar.gz --repo $REPO \
                  --bundle restate-$V.sigstore.json
          NOTES
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "restate $V" --notes-file notes.md --verify-tag
          fi

  # ==========================================================================
  deb:
    name: Build the Debian packages
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential debhelper devscripts dput lintian fakeroot

      # A package whose version is not its tag's cannot be fixed once it is
      # uploaded.
      - name: Check the tag matches VERSION
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$(cat VERSION)" ]; then
            echo "::error::Tag $TAG does not match VERSION ($(cat VERSION))"
            exit 1
          fi

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::LAUNCHPAD_GPG_PRIVATE_KEY is not set: see the top of this workflow"
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Loopback pinentry, as there is no terminal to ask on, and a cache
          # long enough that the passphrase given once below is still there
          # when dpkg-buildpackage signs.
          {
            echo "allow-loopback-pinentry"
            echo "default-cache-ttl 3600"
            echo "max-cache-ttl 3600"
          } > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpgconf --kill gpg-agent || true
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          # The secret and the repository have to agree on the key: either
          # disagreeing makes an upload Launchpad rejects long after the tag.
          PINNED="$(grep -vE '^[[:space:]]*(#|$)' debian/signing-fingerprint | head -1 |
                    tr -d '[:space:]')"
          if [ "$PINNED" != "$KEYID" ]; then
            echo "::error::LAUNCHPAD_GPG_PRIVATE_KEY is $KEYID, but debian/signing-fingerprint pins $PINNED"
            exit 1
          fi
          echo "RESTATE_SIGNING_KEY=$KEYID" >> "$GITHUB_ENV"
          echo "$KEYID:6:" | gpg --batch --import-ownertrust
          # Sign once, so the agent holds the passphrase for the builds.
          echo test | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --local-user "$KEYID" \
            --armor --detach-sign --output /dev/null

      # The binary package for this runner, which deb-verify installs. It is
      # not uploaded: Launchpad builds its own from the source packages.
      - name: Build the binary package
        run: scripts/build-deb.sh

      - name: lintian
        run: lintian --fail-on error,warning ../restate_*.deb

      # One signed source package per series: Launchpad builds per series,
      # and rejects an upload whose changelog names one it does not know.
      - name: Build a signed source package for each series
        env:
          SERIES_LIST: ${{ vars.LAUNCHPAD_SERIES || 'jammy noble resolute' }}
        run: |
          set -eux
          for series in $SERIES_LIST; do
            make clean
            SERIES="$series" scripts/build-deb.sh --source
          done

      - name: Collect the packages
        run: |
          set -eux
          mkdir -p packages
          cp ../restate_*.deb ../restate_*.dsc ../restate_*.tar.* ../restate_*.changes \
             ../restate_*.buildinfo packages/
          # The public half of the key, for the upload job: dput checks the
          # signature on each .changes before it sends it, on a runner whose
          # keyring is empty. Carried here rather than fetched from a key
          # server, which has been known to lose a key that was there.
          gpg --armor --export "$RESTATE_SIGNING_KEY" > packages/signing-key.pub.asc
          ls -l packages/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  deb-verify:
    name: Verify the package installs
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # Clean containers, not this runner, which has the compiler and every
      # tool the build needed: "it works here" on the machine that built it
      # proves little. The release it was built on, and the newest, which the
      # same binary has to install on too; each series' own build is
      # Launchpad's, from the source packages.
      - name: Install it on clean Ubuntu releases, use it and remove it
        run: |
          set -eu
          for release in 24.04 26.04; do
            echo "::group::ubuntu:$release"
            docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/scripts:/s:ro" \
              "ubuntu:$release" sh /s/verify-deb.sh /packages
            echo "::endgroup::"
          done

  # ==========================================================================
  ppa:
    name: Upload to the Launchpad PPA
    needs: deb-verify
    runs-on: ubuntu-latest
    environment: launchpad
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Install dput
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dput

      # The public key only: nothing is signed here, and the private half has
      # no business on this runner.
      - name: Trust the signing key enough to check the upload
        run: |
          set -eu
          gpg --batch --quiet --import packages/signing-key.pub.asc
          KEYID="$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "$KEYID:6:" | gpg --batch --import-ownertrust

      - name: Upload the source packages
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA || 'ppa:bceverly/restate' }}
        run: |
          set -eu
          OWNER="${PPA#ppa:}"; OWNER="${OWNER%%/*}"
          NAME="${PPA##*/}"
          API="https://api.launchpad.net/1.0/~$OWNER/+archive/ubuntu/$NAME"
          # The versions the PPA has already. Launchpad rejects one sent
          # again, but by email minutes later, one for each series a retry
          # sends again; skipping them keeps a retry quiet. The API is public.
          PUBLISHED="$(curl -sS --max-time 30 -H 'Accept: application/json' \
                         "$API?ws.op=getPublishedSources" 2> /dev/null |
                       grep -o '"source_package_version": *"[^"]*"' |
                       sed 's/.*: *"\(.*\)"/\1/' || true)"
          uploaded=0
          skipped=0
          failed=""
          for changes in packages/restate_*_source.changes; do
            [ -f "$changes" ] || continue
            version="$(sed -n 's/^Version: //p' "$changes" | head -1)"
            if printf '%s\n' "$PUBLISHED" | grep -qxF "$version"; then
              echo "$version is in $PPA already: skipped"
              skipped=$((skipped + 1))
              continue
            fi
            # Retried: Launchpad's upload server answers "550 internal server
            # error" now and then. dput records a success beside the .changes
            # and will not send it again, so that record goes first, to make a
            # retry a retry. Never --unchecked: dput's check of the signature
            # is what stands between a broken upload and a rejection with no
            # explanation.
            ok=0
            for attempt in 1 2 3 4 5; do
              rm -f "${changes%.changes}.upload" "$changes.upload"
              echo "Uploading $(basename "$changes") to $PPA (attempt $attempt)"
              if dput "$PPA" "$changes"; then
                ok=1
                break
              fi
              [ "$attempt" -lt 5 ] && sleep $((attempt * 20))
            done
            if [ "$ok" -eq 1 ]; then
              uploaded=$((uploaded + 1))
              sleep 10
            else
              failed="$failed $version"
            fi
          done
          echo "uploaded: $uploaded   already there: $skipped   failed:${failed:- none}"
          if [ -n "$failed" ]; then
            echo "::error::Not uploaded:$failed. What was uploaded is in the PPA; run this job again for the rest."
            exit 1
          fi
          if [ "$uploaded" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            echo "::error::No source packages were found to upload."
            exit 1
          fi
          echo "Accepted, not yet published: Launchpad builds them now. Follow it at"
          echo "  https://launchpad.net/~$OWNER/+archive/ubuntu/$NAME/+packages"

  # ==========================================================================
  # Fedora COPR: the source package, which COPR builds for every chroot the
  # project has (Fedora, EPEL 9 and 10, openSUSE, each architecture). Only
  # once the RPMs have installed: a build there is published as it finishes.
  # The project and its chroots are set up on COPR, not here -- see the top.
  copr:
    name: Send it to Fedora COPR
    needs: [build, rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: srpm
          path: srpm

      - name: Install copr-cli
        run: |
          set -eu
          # rich is a dependency copr-cli does not declare.
          pip3 install --user --quiet copr-cli rich
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # printf, not a heredoc through sed: a token can hold a '/'.
      - name: Configure the credentials
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          set -eu
          if [ -z "${COPR_LOGIN:-}" ] || [ -z "${COPR_USERNAME:-}" ] || [ -z "${COPR_API_TOKEN:-}" ]; then
            echo "::error::COPR_LOGIN, COPR_USERNAME and COPR_API_TOKEN must all be set: see the top of this workflow"
            exit 1
          fi
          mkdir -p ~/.config
          umask 077
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_LOGIN" "$COPR_USERNAME" "$COPR_API_TOKEN" > ~/.config/copr
          copr-cli whoami

      # --nowait, then followed: the emulated architectures' builds outlast a
      # step that waits on them. A build that fails fails this job; one still
      # going at the end is left to finish, and said.
      - name: Build it there
        env:
          PROJECT: ${{ vars.COPR_PROJECT || 'bceverly/restate' }}
        run: |
          set -eu
          SRPM="$(find srpm -name 'restate-*.src.rpm' | head -1)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if copr-cli build --nowait "$PROJECT" "$SRPM" | tee build.log; then
              ok=1
              break
            fi
            sleep $((attempt * 20))
          done
          [ "$ok" -eq 1 ] || { echo "::error::COPR did not take the build"; exit 1; }
          ID="$(sed -n 's/^Created builds: *//p' build.log | awk '{ print $1 }')"
          [ -n "$ID" ] || { echo "::error::no build id in what copr-cli said"; exit 1; }
          echo "https://copr.fedorainfracloud.org/coprs/build/$ID"
          for _ in $(seq 1 80); do
            STATE="$(copr-cli status "$ID" 2> /dev/null || echo unknown)"
            echo "  $STATE"
            case "$STATE" in
              succeeded) exit 0 ;;
              failed | canceled) echo "::error::COPR build $ID $STATE"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::warning::COPR build $ID is still going; it publishes when it is done"

  # ==========================================================================
  # The openSUSE Build Service: the tarball and the spec committed to the
  # package there, which OBS builds for every repository the project has
  # (Tumbleweed, Leap, SLE, and any other it is given), then followed to the
  # end -- a commit OBS takes and then fails to build is a failure here, not
  # a green job and a package that stays at the last version.
  obs:
    name: Send it to the openSUSE Build Service
    needs: [build, rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      - name: Install osc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends osc

      - name: Configure the credentials
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -eu
          if [ -z "${OBS_USERNAME:-}" ] || [ -z "${OBS_PASSWORD:-}" ]; then
            echo "::error::OBS_USERNAME and OBS_PASSWORD must both be set: see the top of this workflow"
            exit 1
          fi
          mkdir -p ~/.config/osc
          umask 077
          printf '[general]\napiurl = https://api.opensuse.org\n\n[https://api.opensuse.org]\nuser = %s\npass = %s\n' \
            "$OBS_USERNAME" "$OBS_PASSWORD" > ~/.config/osc/oscrc

      - name: Commit the release to the package
        env:
          V: ${{ needs.build.outputs.version }}
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          PROJECT: ${{ vars.OBS_PROJECT }}
        run: |
          set -eu
          PROJECT="${PROJECT:-home:$OBS_USERNAME}"
          echo "OBS_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          tar -xzf "source/restate-$V.tar.gz"
          for attempt in 1 2 3 4 5; do
            rm -rf "$PROJECT"
            osc checkout "$PROJECT/restate" && break
            [ "$attempt" -lt 5 ] || { echo "::error::osc checkout failed"; exit 1; }
            sleep $((attempt * 20))
          done
          cd "$PROJECT/restate"
          for f in restate-*.tar.gz restate.spec; do
            if [ -e "$f" ]; then
              osc rm "$f"
            fi
          done
          cp "$GITHUB_WORKSPACE/source/restate-$V.tar.gz" .
          sed -e "s|@VERSION@|$V|g" -e "s|@DATE@|$(LC_ALL=C date -u '+%a %b %d %Y')|g" \
            "$GITHUB_WORKSPACE/restate-$V/packaging/rpm/restate.spec.in" > restate.spec
          osc add "restate-$V.tar.gz" restate.spec
          for attempt in 1 2 3 4 5; do
            osc commit -m "restate $V" && break
            [ "$attempt" -lt 5 ] || { echo "::error::osc commit failed"; exit 1; }
            sleep $((attempt * 20))
          done

      - name: Wait for it to build
        run: |
          set -eu
          sleep 120
          for _ in $(seq 1 60); do
            RESULTS="$(osc results "$OBS_PROJECT" restate 2> /dev/null || true)"
            printf '%s\n' "$RESULTS"
            if printf '%s\n' "$RESULTS" | grep -Eq '(failed|broken|unresolvable)'; then
              printf '%s\n' "$RESULTS" | awk '$NF ~ /failed|broken/ { print $1, $2 }' |
                while read -r repo arch; do
                  osc remotebuildlog "$OBS_PROJECT" restate "$repo" "$arch" | tail -60 || true
                done
              echo "::error::OBS could not build it: see above"
              exit 1
            fi
            if [ -n "$RESULTS" ] && ! printf '%s\n' "$RESULTS" |
                grep -Eq '(scheduled|building|dispatching|blocked|finished|signing|unknown)'; then
              echo "Built everywhere."
              exit 0
            fi
            sleep 60
          done
          echo "::warning::OBS is still building; it publishes each repository when it is done"

  # ==========================================================================
  # Homebrew: the formula, written for this release's tarball once the
  # release that holds it is published, then installed from source, tested,
  # audited and removed on macOS before it goes to the tap.
  homebrew:
    name: Publish the Homebrew formula
    needs: [build, publish]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source

      - name: Write the formula
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tar -xzf "source/restate-$V.tar.gz"
          SHA="$(shasum -a 256 "source/restate-$V.tar.gz" | awk '{ print $1 }')"
          sed -e "s|@VERSION@|$V|g" -e "s|@SHA256@|$SHA|g" \
            "restate-$V/packaging/homebrew/restate.rb.in" > restate.rb
          cat restate.rb

      # From a tap of its own on this runner, as brew installs formulae only
      # from taps; the URL is the published release's, so this is what
      # someone installing it will download.
      - name: Install it from source, test it, audit it and remove it
        run: |
          set -eu
          brew tap-new --no-git restate/check
          cp restate.rb "$(brew --repository restate/check)/Formula/restate.rb"
          brew install --build-from-source restate/check/restate
          brew test restate/check/restate
          brew audit --strict restate/check/restate
          brew uninstall restate/check/restate
          brew untap restate/check

      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP: ${{ vars.HOMEBREW_TAP || 'bceverly/homebrew-tap' }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set: see the top of this workflow"
            exit 1
          fi
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          export GIT_SSH_COMMAND="ssh -i $KEYFILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:$TAP.git" tap
          mkdir -p tap/Formula
          cp restate.rb tap/Formula/restate.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/restate.rb
          if git diff --cached --quiet; then
            echo "The tap has restate $V already."
            exit 0
          fi
          git commit -m "restate $V"
          git push origin HEAD
