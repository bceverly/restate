#
# Publish a release when a version tag is pushed.
#
# `make release` writes the version into VERSION, commits, tags and pushes --
# and the tag push is what lands here. There is no such thing as an untagged
# release.
#
#   gate     wait for CI, Security and CodeQL to have passed on this commit
#   build    the source tarball, built and tested from that tarball on a clean
#            runner, its SHA-256 checksums, and a signed build-provenance
#            attestation (SLSA) that says which workflow made it from which
#            commit
#   publish  a GitHub release with the tarball, the checksums and the notes:
#            what changed -- the subject of every commit since the previous
#            release tag -- then how to build, install and verify it
#   deb      the binary .deb, checked by lintian, and a signed source package
#            for each Ubuntu series
#   deb-verify  the .deb installed with apt on clean Ubuntu releases, used,
#            and removed (scripts/verify-deb.sh)
#   ppa      the source packages uploaded to the Launchpad PPA, which builds
#            and publishes them for every architecture it has
#
# `ppa` needs `deb-verify`, so a package that builds but does not install
# never reaches the PPA: an upload there cannot be withdrawn, only superseded
# by a higher version. The BSD ports and Homebrew come later; see ROADMAP.md.
#
# ---------------------------------------------------------------------------
# What the PPA needs configured in the repository
# ---------------------------------------------------------------------------
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   LAUNCHPAD_GPG_PRIVATE_KEY  the ASCII-armored private key whose public half
#                              is registered on the Launchpad account, and
#                              whose fingerprint debian/signing-fingerprint pins
#   LAUNCHPAD_GPG_PASSPHRASE   that key's passphrase
#
# Variables (the same page, Variables tab) -- optional, defaults shown:
#   LAUNCHPAD_PPA       ppa:bceverly/restate
#   LAUNCHPAD_SERIES    the Ubuntu series to build for, space separated
#                       (default: jammy noble resolute, the supported LTS
#                       releases, each of which the package is built and
#                       installed on before a release)
#
# The upload job runs in the `launchpad` environment, which can be given a
# required reviewer to hold each upload for a person's approval.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================================================
  # A tag push runs neither CI nor the scans -- they are wired to branches --
  # so this waits for the runs that already happened on this exact commit,
  # which `make release` pushed to main before tagging it.
  gate:
    name: Wait for CI, Security and CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the checks on this commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TIMEOUT_MINUTES: "60"
        run: |
          set -euo pipefail
          WANTED="CI Security CodeQL"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          echo "Waiting for [$WANTED] on $SHA"
          while :; do
            PENDING=""
            FAILED=""
            MISSING=""
            for NAME in $WANTED; do
              READ=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                     --jq ".workflow_runs[] | select(.name==\"$NAME\") |
                           [.status, (.conclusion // \"pending\")] | @tsv" \
                     | head -1 || true)
              if [ -z "$READ" ]; then MISSING="$MISSING $NAME"; continue; fi
              STATUS=$(printf '%s' "$READ" | cut -f1)
              CONCLUSION=$(printf '%s' "$READ" | cut -f2)
              if [ "$STATUS" != completed ]; then
                PENDING="$PENDING $NAME($STATUS)"
              elif [ "$CONCLUSION" != success ] && [ "$CONCLUSION" != skipped ]; then
                FAILED="$FAILED $NAME($CONCLUSION)"
              fi
            done
            if [ -n "$FAILED" ]; then
              echo "::error::Refusing to release --$FAILED did not pass on $SHA"
              exit 1
            fi
            # A tag on a commit that never reached a branch has no runs at all.
            if [ -n "$MISSING" ] && [ "$(date +%s)" -gt $(( DEADLINE - (TIMEOUT_MINUTES - 5) * 60 )) ]; then
              echo "::error::No run found for$MISSING on $SHA after 5 minutes."
              echo "::error::Was this commit pushed to a branch before it was tagged?"
              exit 1
            fi
            if [ -z "$PENDING" ] && [ -z "$MISSING" ]; then
              echo "All required checks passed on $SHA."
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES}m waiting for$PENDING$MISSING"
              exit 1
            fi
            echo "  still waiting:$PENDING$MISSING"
            sleep 30
          done

  # ==========================================================================
  build:
    name: Build the release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # to sign the attestation
      attestations: write  # to store it
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag and VERSION must agree: a tag pushed by hand is exactly the
      # case where they might not.
      - name: Check the tag matches VERSION
        id: version
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(cat VERSION)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match VERSION ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # git archive: exactly the committed tree, nothing from the workspace.
      - name: Make the source tarball
        run: |
          set -eu
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar --prefix="restate-$V/" HEAD | gzip -9n > "dist/restate-$V.tar.gz"

      # The tarball has to build and pass its tests on its own, without the
      # git repository it came from -- which is how everyone downloading it
      # will build it.
      - name: Build and test from the tarball
        run: |
          set -eu
          V="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/fromtar
          tar -xzf "dist/restate-$V.tar.gz" -C /tmp/fromtar
          cd "/tmp/fromtar/restate-$V"
          make build WERROR=-Werror
          make test-unit test-cli
          ./bin/restate --version | head -1 | grep -qx "restate $V"

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The signed attestation, beside the tarball in the release too, not
      # only in GitHub's attestation store: a download can be checked offline
      # with it, and a release with no signature file in it is an unsigned
      # release to anyone who looks.
      - name: Attach the signature to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          cp "$BUNDLE" "dist/restate-$V.tar.gz.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and its tags: the notes list the commits since the
      # previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          # The release before this one: the newest version tag older than
          # this tag, in version order.
          PREV=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' |
                 sort -V | awk -v t="$TAG" '$0 == t { print last; exit } { last = $0 }')
          {
            echo "restate $V"
            echo
            if [ -n "$PREV" ]; then
              echo "What changed since $PREV:"
              echo
              git log --no-merges --reverse --format='- %s' "$PREV..$TAG" -- \
                | grep -v '^- Release v' || echo "- (no changes besides the version)"
            else
              echo "The first release."
            fi
            echo
            echo "No publicly known vulnerability was fixed in this release unless a"
            echo "line above says so; see SECURITY.md for how they are reported."
          } > notes.md
          cat >> notes.md <<NOTES

          Install on Ubuntu 22.04, 24.04 or 26.04 from the PPA, once Launchpad
          has built it there (usually within the hour):

              sudo add-apt-repository ppa:bceverly/restate
              sudo apt install restate

          Build and install from source (Ubuntu 26.04 and any Linux, the BSDs
          with gmake, macOS):

              tar -xzf restate-$V.tar.gz && cd restate-$V
              make build && sudo make install

          Verify the download:

              sha256sum -c SHA256SUMS
              gh attestation verify restate-$V.tar.gz --repo $REPO

          or offline, with the signed attestation attached here:

              gh attestation verify restate-$V.tar.gz --repo $REPO \
                  --bundle restate-$V.tar.gz.sigstore.json
          NOTES
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "restate $V" --notes-file notes.md --verify-tag
          fi

  # ==========================================================================
  deb:
    name: Build the Debian packages
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential debhelper devscripts dput lintian fakeroot

      # A package whose version is not its tag's cannot be fixed once it is
      # uploaded.
      - name: Check the tag matches VERSION
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$(cat VERSION)" ]; then
            echo "::error::Tag $TAG does not match VERSION ($(cat VERSION))"
            exit 1
          fi

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::LAUNCHPAD_GPG_PRIVATE_KEY is not set: see the top of this workflow"
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Loopback pinentry, as there is no terminal to ask on, and a cache
          # long enough that the passphrase given once below is still there
          # when dpkg-buildpackage signs.
          {
            echo "allow-loopback-pinentry"
            echo "default-cache-ttl 3600"
            echo "max-cache-ttl 3600"
          } > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpgconf --kill gpg-agent || true
          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          # The secret and the repository have to agree on the key: either
          # disagreeing makes an upload Launchpad rejects long after the tag.
          PINNED="$(grep -vE '^[[:space:]]*(#|$)' debian/signing-fingerprint | head -1 |
                    tr -d '[:space:]')"
          if [ "$PINNED" != "$KEYID" ]; then
            echo "::error::LAUNCHPAD_GPG_PRIVATE_KEY is $KEYID, but debian/signing-fingerprint pins $PINNED"
            exit 1
          fi
          echo "RESTATE_SIGNING_KEY=$KEYID" >> "$GITHUB_ENV"
          echo "$KEYID:6:" | gpg --batch --import-ownertrust
          # Sign once, so the agent holds the passphrase for the builds.
          echo test | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --local-user "$KEYID" \
            --armor --detach-sign --output /dev/null

      # The binary package for this runner, which deb-verify installs. It is
      # not uploaded: Launchpad builds its own from the source packages.
      - name: Build the binary package
        run: scripts/build-deb.sh

      - name: lintian
        run: lintian --fail-on error,warning ../restate_*.deb

      # One signed source package per series: Launchpad builds per series,
      # and rejects an upload whose changelog names one it does not know.
      - name: Build a signed source package for each series
        env:
          SERIES_LIST: ${{ vars.LAUNCHPAD_SERIES || 'jammy noble resolute' }}
        run: |
          set -eux
          for series in $SERIES_LIST; do
            make clean
            SERIES="$series" scripts/build-deb.sh --source
          done

      - name: Collect the packages
        run: |
          set -eux
          mkdir -p packages
          cp ../restate_*.deb ../restate_*.dsc ../restate_*.tar.* ../restate_*.changes \
             ../restate_*.buildinfo packages/
          # The public half of the key, for the upload job: dput checks the
          # signature on each .changes before it sends it, on a runner whose
          # keyring is empty. Carried here rather than fetched from a key
          # server, which has been known to lose a key that was there.
          gpg --armor --export "$RESTATE_SIGNING_KEY" > packages/signing-key.pub.asc
          ls -l packages/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages/
          retention-days: 30
          if-no-files-found: error

  # ==========================================================================
  deb-verify:
    name: Verify the package installs
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # Clean containers, not this runner, which has the compiler and every
      # tool the build needed: "it works here" on the machine that built it
      # proves little. The release it was built on, and the newest, which the
      # same binary has to install on too; each series' own build is
      # Launchpad's, from the source packages.
      - name: Install it on clean Ubuntu releases, use it and remove it
        run: |
          set -eu
          for release in 24.04 26.04; do
            echo "::group::ubuntu:$release"
            docker run --rm -v "$PWD/packages:/packages:ro" -v "$PWD/scripts:/s:ro" \
              "ubuntu:$release" sh /s/verify-deb.sh /packages
            echo "::endgroup::"
          done

  # ==========================================================================
  ppa:
    name: Upload to the Launchpad PPA
    needs: deb-verify
    runs-on: ubuntu-latest
    environment: launchpad
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Install dput
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dput

      # The public key only: nothing is signed here, and the private half has
      # no business on this runner.
      - name: Trust the signing key enough to check the upload
        run: |
          set -eu
          gpg --batch --quiet --import packages/signing-key.pub.asc
          KEYID="$(gpg --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "$KEYID:6:" | gpg --batch --import-ownertrust

      - name: Upload the source packages
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA || 'ppa:bceverly/restate' }}
        run: |
          set -eu
          OWNER="${PPA#ppa:}"; OWNER="${OWNER%%/*}"
          NAME="${PPA##*/}"
          API="https://api.launchpad.net/1.0/~$OWNER/+archive/ubuntu/$NAME"
          # The versions the PPA has already. Launchpad rejects one sent
          # again, but by email minutes later, one for each series a retry
          # sends again; skipping them keeps a retry quiet. The API is public.
          PUBLISHED="$(curl -sS --max-time 30 -H 'Accept: application/json' \
                         "$API?ws.op=getPublishedSources" 2> /dev/null |
                       grep -o '"source_package_version": *"[^"]*"' |
                       sed 's/.*: *"\(.*\)"/\1/' || true)"
          uploaded=0
          skipped=0
          failed=""
          for changes in packages/restate_*_source.changes; do
            [ -f "$changes" ] || continue
            version="$(sed -n 's/^Version: //p' "$changes" | head -1)"
            if printf '%s\n' "$PUBLISHED" | grep -qxF "$version"; then
              echo "$version is in $PPA already: skipped"
              skipped=$((skipped + 1))
              continue
            fi
            # Retried: Launchpad's upload server answers "550 internal server
            # error" now and then. dput records a success beside the .changes
            # and will not send it again, so that record goes first, to make a
            # retry a retry. Never --unchecked: dput's check of the signature
            # is what stands between a broken upload and a rejection with no
            # explanation.
            ok=0
            for attempt in 1 2 3 4 5; do
              rm -f "${changes%.changes}.upload" "$changes.upload"
              echo "Uploading $(basename "$changes") to $PPA (attempt $attempt)"
              if dput "$PPA" "$changes"; then
                ok=1
                break
              fi
              [ "$attempt" -lt 5 ] && sleep $((attempt * 20))
            done
            if [ "$ok" -eq 1 ]; then
              uploaded=$((uploaded + 1))
              sleep 10
            else
              failed="$failed $version"
            fi
          done
          echo "uploaded: $uploaded   already there: $skipped   failed:${failed:- none}"
          if [ -n "$failed" ]; then
            echo "::error::Not uploaded:$failed. What was uploaded is in the PPA; run this job again for the rest."
            exit 1
          fi
          if [ "$uploaded" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            echo "::error::No source packages were found to upload."
            exit 1
          fi
          echo "Accepted, not yet published: Launchpad builds them now. Follow it at"
          echo "  https://launchpad.net/~$OWNER/+archive/ubuntu/$NAME/+packages"
